name: flutter_puja_app
description: "సర్వ దేవతా నిత్య & షోడశోపచార పూజా విధి - Universal Devotional Puja App with Dual Script (Sanskrit & Telugu), Deep Spiritual Learnings, and Custom Voice Model."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management & Architecture
  provider: ^6.1.2
  
  # Google Fonts for flawless Telugu & Devanagari typography
  google_fonts: ^6.2.1
  
  # Audio Playback (Mobile, Web, Desktop)
  just_audio: ^0.9.36
  audio_session: ^0.1.18
  
  # Local Storage & Preferences (100% Offline)
  shared_preferences: ^2.2.3
  
  # Audio Recording for User's Own Voice Training
  record: ^5.1.2
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
