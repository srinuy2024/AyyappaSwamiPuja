name: Build Flutter Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Android Platform and Sacred Resources
        working-directory: flutter_puja_app
        run: |
          mkdir -p /tmp/saved_res
          if [ -d "android/app/src/main/res" ]; then
            cp -r android/app/src/main/res/* /tmp/saved_res/ || true
          fi

          if [ ! -f "android/build.gradle" ] && [ ! -f "android/build.gradle.kts" ]; then
            echo "Generating android platform files..."
            flutter create . --platforms=android --org=com.ayyappa.puja
          fi

          # Restore custom sacred launcher icons and strings.xml
          if [ -d "/tmp/saved_res" ]; then
            mkdir -p android/app/src/main/res
            cp -r /tmp/saved_res/* android/app/src/main/res/ || true
          fi

          # Ensure AndroidManifest.xml has correct label, icon, and NO package attribute (required for AGP 8+)
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/package="com.ayyappa.puja"//g' android/app/src/main/AndroidManifest.xml || true
            sed -i 's/android:label="[^"]*"/android:label="@string\/app_name"/g' android/app/src/main/AndroidManifest.xml || true
            sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/g' android/app/src/main/AndroidManifest.xml || true
          fi

          # Ensure modern Android minSdkVersion 21 compatibility
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle.kts || true
          fi

          # Ensure all declared asset directories exist
          mkdir -p assets/data assets/icon assets/images/deities

      - name: Install Flutter Dependencies
        working-directory: flutter_puja_app
        run: flutter pub get

      - name: Build Android APK
        working-directory: flutter_puja_app
        run: |
          # Build split-per-abi APKs (slashes APK size by ~60% from 22MB down to ~9MB)
          flutter build apk --release --split-per-abi --no-tree-shake-icons || flutter build apk --release --no-tree-shake-icons

          # Copy with clear device-friendly labels
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/PoojaMandiram-arm64-OnePlus-Modern-Phones.apk
          fi
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/PoojaMandiram-armeabi-Older-32bit-Phones.apk
          fi

      - name: Upload OnePlus & Modern Phones Lightweight APK (~9MB)
        uses: actions/upload-artifact@v4
        with:
          name: PoojaMandiram-OnePlus-Modern-Phones-APK
          path: flutter_puja_app/build/app/outputs/flutter-apk/PoojaMandiram-arm64-OnePlus-Modern-Phones.apk
          retention-days: 30

      - name: Upload Older 32-bit Phones APK
        uses: actions/upload-artifact@v4
        with:
          name: PoojaMandiram-Older-32bit-Phones-APK
          path: flutter_puja_app/build/app/outputs/flutter-apk/PoojaMandiram-armeabi-Older-32bit-Phones.apk
          retention-days: 30
