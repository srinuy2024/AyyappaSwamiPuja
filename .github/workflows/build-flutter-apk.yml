name: Build Flutter Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Create Android Platform Scaffolding if Missing
        working-directory: flutter_puja_app
        run: |
          if [ ! -d "android" ]; then
            echo "Generating android platform files..."
            flutter create . --platforms=android --org=com.ayyappa.puja
          fi
          # Ensure modern Android compatibility
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle.kts || true
          fi

      - name: Install Flutter Dependencies
        working-directory: flutter_puja_app
        run: flutter pub get

      - name: Build Android APK
        working-directory: flutter_puja_app
        run: |
          flutter build apk --release --no-tree-shake-icons || flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ayyappa-Puja-APK
          path: flutter_puja_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
